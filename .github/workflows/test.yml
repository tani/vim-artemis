name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  specs:
    name: specs (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: vim
          - host: nvim-stable
          - host: nvim-nightly
    steps:
      - uses: actions/checkout@v4
      - name: Install Vim (+lua)
        if: matrix.host == 'vim'
        run: sudo apt-get update && sudo apt-get install -y vim-nox
      - name: Install Neovim
        if: startsWith(matrix.host, 'nvim')
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.host == 'nvim-nightly' && 'nightly' || 'stable' }}
      - name: Run specs
        run: test/run.sh ${{ startsWith(matrix.host, 'nvim') && 'nvim' || 'vim' }}

  plugins:
    name: plugins (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [vim, nvim]
    steps:
      - uses: actions/checkout@v4
      - name: Install Vim (+lua)
        if: matrix.host == 'vim'
        run: sudo apt-get update && sudo apt-get install -y vim-nox
      - name: Install Neovim
        if: matrix.host == 'nvim'
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Fetch plugins
        run: |
          git clone --depth 1 https://github.com/echasnovski/mini.nvim /tmp/mini.nvim
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim /tmp/plenary.nvim
      - name: Behaviour checks (mini.nvim)
        run: |
          out=$(test/plugins/behavior.sh ${{ matrix.host }} /tmp/mini.nvim)
          echo "$out"
          ! echo "$out" | grep -q '^FAIL'
      - name: plenary.job / plenary.async
        run: |
          export ARTEMIS_ROOT=$PWD SMOKE_PLUGINS=/tmp/plenary.nvim ARTEMIS_OUT=$(mktemp)
          if [ "${{ matrix.host }}" = vim ]; then
            TERM=dumb vim -u NONE -i NONE -N --not-a-term -c "luafile test/plugins/plenary_job.lua" -c "qa!" </dev/null >/dev/null 2>&1 || true
          else
            nvim --headless -u NONE -i NONE -c "luafile test/plugins/plenary_job.lua" -c "qa!" >/dev/null 2>&1 || true
          fi
          cat "$ARTEMIS_OUT"
          ! grep -q ERROR "$ARTEMIS_OUT" && grep -q 'async lib: true' "$ARTEMIS_OUT"
